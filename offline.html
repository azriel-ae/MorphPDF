<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MorphPDF — Offline</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        :root { color-scheme: light; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F7F4ED;
            color: #302D28;
            font-family: Inter, system-ui, -apple-system, sans-serif;
            padding: 24px;
        }
        .card {
            max-width: 420px;
            background: #FFFFFF;
            border: 1px solid #E5DED2;
            border-radius: 16px;
            padding: 36px 32px;
            text-align: center;
        }
        .mark {
            width: 56px; height: 56px;
            margin: 0 auto 18px;
            display: flex; align-items: center; justify-content: center;
        }
        h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 10px; }
        p  { font-size: 14px; line-height: 1.6; color: #777168; margin-bottom: 8px; }
        ul { text-align: left; margin: 18px 0 6px; padding: 0; list-style: none; }
        li {
            font-size: 13px; color: #302D28; font-weight: 550;
            display: flex; align-items: center; gap: 8px;
            padding: 7px 0;
        }
        li::before { content: ""; width: 6px; height: 6px; border-radius: 99px; background: #E9B978; flex-shrink: 0; }
        button {
            margin-top: 20px;
            padding: 10px 22px;
            font: 600 13.5px Inter, system-ui, sans-serif;
            color: #2F2213;
            background: #C98D50;
            border: 0;
            border-radius: 9px;
            cursor: pointer;
        }
        button:hover { background: #B27A43; }
    </style>
</head>
<body>
    <main class="card">
        <div class="mark" aria-hidden="true">
            <img src="assets/brand/logo-symbol.svg" alt="" width="56" height="56"
                 onerror="this.style.display='none'">
        </div>
        <h1>Anda sedang offline</h1>
        <p>MorphPDF tidak bisa mengambil data terbaru saat ini.</p>
        <ul>
            <li>Halaman yang sudah terbuka tetap bisa dipakai</li>
            <li>Tools yang sudah dimuat tetap berjalan lokal</li>
            <li>File Anda tidak pernah dikirim ke server</li>
        </ul>
        <button onclick="location.reload()">Coba Lagi</button>
    </main>
</body>
</html>
